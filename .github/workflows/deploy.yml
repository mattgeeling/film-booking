name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Write production config
        run: |
          mkdir -p config
          cat > config/config.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '${{ secrets.DB_HOST }}',
                  'name' => '${{ secrets.DB_NAME }}',
                  'user' => '${{ secrets.DB_USER }}',
                  'pass' => '${{ secrets.DB_PASS }}',
              ],
              'calendar_dry_run' => false,
              'google' => [
                  'service_account_key_path' => __DIR__ . '/service-account.json',
                  'oauth_web_client_id' => '${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}',
                  'workspace_domain' => '${{ secrets.WORKSPACE_DOMAIN }}',
              ],
              'timezone' => 'Europe/London',
          ];
          PHP
          cat > config/service-account.json <<'JSONEOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JSONEOF

      - name: Remove files that shouldn't be deployed
        run: |
          rm -rf .git .github
          rm -f "Filming Plan.pdf"
          rm -f Screenshot*.png

      - name: Deploy to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_TARGET_DIR }}
          sftp_only: true
