name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Write production config
        run: |
          mkdir -p config
          cat > config/config.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '${{ secrets.DB_HOST }}',
                  'name' => '${{ secrets.DB_NAME }}',
                  'user' => '${{ secrets.DB_USER }}',
                  'pass' => '${{ secrets.DB_PASS }}',
              ],
              'calendar_dry_run' => false,
              'google' => [
                  'service_account_key_path' => __DIR__ . '/service-account.json',
                  'oauth_web_client_id' => '${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}',
                  'workspace_domain' => '${{ secrets.WORKSPACE_DOMAIN }}',
              ],
              'timezone' => 'Europe/London',
          ];
          PHP
          cat > config/service-account.json <<'JSONEOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JSONEOF

      - name: Deploy to IONOS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          server-dir: ${{ secrets.IONOS_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            Filming Plan.pdf
            Screenshot*.png
